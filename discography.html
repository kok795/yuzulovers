function displayWorks(category="ALL") {
  const container = document.getElementById("discography");

  const filtered = works
    .filter(work => category === "ALL" || work.category === category)
    .sort((a,b) => b.date.localeCompare(a.date));

  container.innerHTML = filtered.map(work => `
    <div class="item">
      <img src="${work.cover}"
           alt="${work.title}"
           onerror="this.style.opacity='.25'">
      <h3>${work.title}</h3>
      <p>${work.date}</p>
      <span class="category">${work.category}</span>
    </div>
  `).join("");
}

function filterItems(category,button) {
  document.querySelectorAll(".filters button")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");
  displayWorks(category);
}

displayWorks();
