<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DISCOGRAPHY | ゆず大好きな人</title>
<link rel="stylesheet" href="style.css">

<style>
.discography {
  max-width: 1200px;
  margin: 50px auto;
  padding: 20px;
}

.discography h1 {
  text-align: center;
  font-size: 38px;
  letter-spacing: 5px;
}

.disco-subtitle {
  text-align: center;
  color: #888;
  margin-bottom: 40px;
}

.disco-nav {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 35px;
}

.disco-nav button {
  padding: 11px 24px;
  border: 1px solid #d8a34a;
  background: white;
  color: #333;
  cursor: pointer;
  border-radius: 25px;
}

.disco-nav button.active,
.disco-nav button:hover {
  background: #d8a34a;
  color: white;
}

.disco-search {
  display: block;
  width: min(90%, 450px);
  margin: 0 auto 35px;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 25px;
}

.disco-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 30px 20px;
}

.disco-item {
  text-align: left;
}

.disco-item img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 5px;
  background: #eee;
}

.disco-item h3 {
  font-size: 15px;
  margin: 12px 0 5px;
}

.disco-item p {
  font-size: 12px;
  color: #777;
  margin: 4px 0;
}

.disco-type {
  color: #bd8b38 !important;
  font-weight: bold;
}

.disco-empty {
  text-align: center;
  padding: 50px;
  color: #888;
  display: none;
}

@media(max-width:600px) {
  .discography h1 {
    font-size: 29px;
  }

  .disco-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 22px 13px;
  }
}
</style>
</head>

<body>

<main class="discography">

<h1>DISCOGRAPHY</h1>
<p class="disco-subtitle">YUZU MUSIC COLLECTION</p>

<div class="disco-nav">
  <button class="active" data-type="ALL">ALL</button>
  <button data-type="SINGLE">SINGLE</button>
  <button data-type="ALBUM">ALBUM</button>
  <button data-type="VIDEO">DVD / Blu-ray</button>
</div>

<input
  type="search"
  class="disco-search"
  id="discoSearch"
  placeholder="作品名・発売年で検索..."
>

<div class="disco-grid" id="discoGrid"></div>

<p class="disco-empty" id="discoEmpty">
該当する作品はありません。
</p>

</main>

<script>
const works = [

  // SINGLE・ALBUM・VIDEOの作品データをここに追加

  {
    title: "夏色",
    date: "1998.06.03",
    type: "SINGLE",
    image: "uploads/76adc489-c61c-47d6-bd56-766824697711/contents/discography/9211_SNDC-28901.jpg"
  },

  {
    title: "ゆず一家",
    date: "1998.07.23",
    type: "ALBUM",
    image: "uploads/76adc489-c61c-47d6-bd56-766824697711/contents/discography/9109_SNCC-88972.jpg"
  },

  {
    title: "ゆずえん",
    date: "1999.10.14",
    type: "ALBUM",
    image: "images/?q=tbn:ANd9GcRflJECPE0Bnd17BCcgNXm8uexFsrakRr8tl19tGkQ0KQ&s=10"
  }

];

let currentType = "ALL";

function displayWorks() {
  const grid = document.getElementById("discoGrid");
  const search = document.getElementById("discoSearch")
    .value.toLowerCase();

  grid.innerHTML = "";

  const filtered = works.filter(work => {
    const matchType =
      currentType === "ALL" || work.type === currentType;

    const matchSearch =
      work.title.toLowerCase().includes(search) ||
      work.date.includes(search);

    return matchType && matchSearch;
  });

  filtered.forEach(work => {
    const item = document.createElement("article");
    item.className = "disco-item";

    const img = document.createElement("img");
    img.src = work.image;
    img.alt = work.title + " ジャケット";
    img.loading = "lazy";

    const title = document.createElement("h3");
    title.textContent = work.title;

    const date = document.createElement("p");
    date.textContent = work.date;

    const type = document.createElement("p");
    type.className = "disco-type";
    type.textContent = work.type;

    item.append(img, title, date, type);
    grid.appendChild(item);
  });

  document.getElementById("discoEmpty").style.display =
    filtered.length ? "none" : "block";
}

document.querySelectorAll(".disco-nav button")
.forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".disco-nav button")
      .forEach(b => b.classList.remove("active"));

    button.classList.add("active");
    currentType = button.dataset.type;
    displayWorks();
  });
});

document.getElementById("discoSearch")
.addEventListener("input", displayWorks);

displayWorks();
</script>

</body>
</html>
/* テキスト選択を禁止 */
* {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

/* 画像のドラッグを禁止 */
img {
  -webkit-user-drag: none;
  user-drag: none;
}
