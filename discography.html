<script>
const discoData = [
    {
    date: "1997.10.25",
    category: "ALBUM",
    title: "ゆずの素",
    image: "https://res.cloudinary.com/b1q6fpjt/image/upload/v1794716222/9093_SNCC-86920.jpg"
  },
  {
    date: "1998.02.21",
    category: "ALBUM",
    title: "ゆずマン",
    image: "https://res.cloudinary.com/b1q6fpjt/image/upload/v1794721373/images_-_2026-11-15T144235.973.jpg"
  },
  {
    date: "1998.06.03",
    category: "SINGLE",
    title: "夏色",
    image: "https://res.cloudinary.com/b1q6fpjt/image/upload/v1794720934/9211_SNDC-28901.jpg"
  },
  {
    date: "1998.07.23",
    category: "ALBUM",
    title: "ゆず一家",
    image: "https://res.cloudinary.com/b1q6fpjt/image/upload/v1794716274/images.jpg"
  }
  {
    date: "1998.09.18",
    category: "SINGLE",
    title: "少年",
    image: "https://res.cloudinary.com/b1q6fpjt/image/upload/v1794716274/images_1.jpg"
  },
  {
    date: "1998.11.11",
    category: "SINGLE",
    title: "からっぽ",
    image: "https://res.cloudinary.com/b1q6fpjt/image/upload/v1794716274/9209_SNDC-28903.jpg"
  },
  
];

const discoList = document.getElementById("disco-list");

function showDisco(category = "ALL") {
  const items = category === "ALL"
    ? discoData
    : discoData.filter(item => item.category === category);

  discoList.innerHTML = items.map(item => `
    <article class="disco-item">
      <div class="disco-image">
        ${item.image
          ? `<img src="${item.image}" alt="${item.title}">`
          : `<div class="disco-no-image">JACKET</div>`}
      </div>
      <p class="disco-date">${item.date}</p>
      <p class="disco-type">${item.category}</p>
      <h2 class="disco-title">${item.title}</h2>
    </article>
  `).join("");
}

document.querySelectorAll(".disco-filter").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelector(".disco-filter.active")
      ?.classList.remove("active");

    button.classList.add("active");
    showDisco(button.dataset.filter);
  });
});

showDisco();
</script>
