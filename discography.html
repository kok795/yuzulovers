const ydGrid = document.getElementById("yd-grid");

function renderYuzuWorks(category = "all") {
  ydGrid.innerHTML = "";

  const works = yuzuWorks.filter(work =>
    category === "all" || work.type === category
  );

  works.forEach(work => {
    const card = document.createElement("article");
    card.className = "yd-card";

    const image = document.createElement("img");
    image.alt = work.title + " ジャケット";
    image.loading = "lazy";

    if (work.image) {
      image.src = work.image;
    } else {
      image.alt = work.title + "（画像未設定）";
    }

    const title = document.createElement("h3");
    title.textContent = work.title;

    const date = document.createElement("p");
    date.className = "yd-date";
    date.textContent = work.date;

    const type = document.createElement("p");
    type.className = "yd-type";
    type.textContent = work.type.toUpperCase();

    card.append(image, title, date, type);
    ydGrid.appendChild(card);
  });
}

document.querySelectorAll(".yd-tabs button").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".yd-tabs button")
      .forEach(item => item.classList.remove("active"));

    button.classList.add("active");
    renderYuzuWorks(button.dataset.category);
  });
});
