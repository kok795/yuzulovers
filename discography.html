const discoPerPage = 24;
let discoPage = 1;
let discoCategory = "ALL";

const discoList = document.getElementById("disco-list");
const discoPagination = document.getElementById("disco-pagination");

function getDiscoWorks() {
  return discoCategory === "ALL"
    ? discoData
    : discoData.filter(item => item.category === discoCategory);
}

function showDisco() {
  const items = getDiscoWorks();
  const totalPages = Math.ceil(items.length / discoPerPage);
  const start = (discoPage - 1) * discoPerPage;
  const visible = items.slice(start, start + discoPerPage);

  discoList.innerHTML = visible.map(item => `
    <article class="disco-item">
      <div class="disco-image">
        ${item.image
          ? `<img src="${item.image}" alt="${item.title}" draggable="false" loading="lazy">`
          : `<div class="disco-no-image">JACKET</div>`}
      </div>
      <p class="disco-date">${item.date}</p>
      <p class="disco-type">${item.category}</p>
      <h2 class="disco-title">${item.title}</h2>
    </article>
  `).join("");

  showPagination(totalPages);
}

function showPagination(totalPages) {
  discoPagination.innerHTML = "";
  if (totalPages <= 1) return;

  const prev = document.createElement("button");
  prev.textContent = "‹ 前へ";
  prev.disabled = discoPage === 1;
  prev.onclick = () => changePage(discoPage - 1);
  discoPagination.appendChild(prev);

  for (let i = 1; i <= totalPages; i++) {
    const button = document.createElement("button");
    button.textContent = i;
    if (i === discoPage) button.classList.add("active");
    button.onclick = () => changePage(i);
    discoPagination.appendChild(button);
  }

  const next = document.createElement("button");
  next.textContent = "次へ ›";
  next.disabled = discoPage === totalPages;
  next.onclick = () => changePage(discoPage + 1);
  discoPagination.appendChild(next);
}

function changePage(page) {
  const totalPages = Math.ceil(getDiscoWorks().length / discoPerPage);
  if (page < 1 || page > totalPages) return;
  discoPage = page;
  showDisco();
  document.querySelector(".discography-heading")
    .scrollIntoView({ behavior: "smooth" });
}

document.querySelectorAll(".disco-filter").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelector(".disco-filter.active")
      ?.classList.remove("active");
    button.classList.add("active");
    discoCategory = button.dataset.filter;
    discoPage = 1;
    showDisco();
  });
});

showDisco();
</script>
