
<!DOCTYPE html>
<html lang="ja">
<head>

<title>DISCOGRAPHY | ゆず大好きな人</title>

<style>
* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

body {
  margin: 0;
  background: #fffdf8;
  color: #333;
  font-family: sans-serif;
}

header {
  background: #f4c542;
  padding: 25px 15px;
  text-align: center;
}

header h1 {
  letter-spacing: 4px;
  margin: 0;
}

header p {
  font-size: 12px;
  letter-spacing: 3px;
}

nav {
  background: #333;
  padding: 15px;
  text-align: center;
}

nav a {
  color: white;
  text-decoration: none;
  margin: 0 10px;
  font-size: 13px;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 30px 18px;
}

h2 {
  text-align: center;
  letter-spacing: 5px;
  border-bottom: 2px solid #f4c542;
  padding-bottom: 15px;
}

.intro {
  text-align: center;
  line-height: 1.8;
  margin-bottom: 30px;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin: 25px 0;
}

.filters button {
  border: 1px solid #d5ad32;
  background: white;
  padding: 10px 16px;
  cursor: pointer;
  border-radius: 20px;
}

.filters button.active {
  background: #f4c542;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 25px 15px;
}

.item {
  text-align: center;
  min-width: 0;
}

.item img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  background: #eee;
  border: 1px solid #ddd;
}

.item h3 {
  font-size: 14px;
  margin: 10px 0 5px;
}

.item p {
  font-size: 12px;
  color: #777;
  margin: 4px 0;
}

.category {
  display: inline-block;
  font-size: 10px;
  background: #f8e9b4;
  padding: 4px 8px;
  margin-top: 5px;
}

footer {
  margin-top: 60px;
  background: #333;
  color: white;
  text-align: center;
  padding: 25px;
  font-size: 12px;
}

@media(max-width:700px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
  }
  nav a {
    margin: 5px;
  }
}
</style>
</head>

<body>

<header>
<h1>YUZU LOVERS</h1>
<p>OFFICIAL FAN SITE</p>
</header>

<nav>
<a href="index.html">HOME</a>
<a href="news.html">NEWS</a>

</nav>

<main>

<h2>DISCOGRAPHY</h2>

<p class="intro">
ゆずがこれまでに届けてきた音楽作品。<br>
1997年から現在までの作品を紹介します。
</p>

<div class="filters">
<button class="active" onclick="filterItems('ALL',this)">ALL</button>
<button onclick="filterItems('SINGLE',this)">SINGLE</button>
<button onclick="filterItems('ALBUM',this)">ALBUM</button>
<button onclick="filterItems('BEST',this)">BEST ALBUM</button>
<button onclick="filterItems('DIGITAL',this)">DIGITAL</button>
<button onclick="filterItems('DVD',this)">DVD</button>
<button onclick="filterItems('BLU-RAY',this)">BLU-RAY</button>
</div>

<div class="grid" id="discography"></div>

</main>

<footer>
<p>YUZU LOVERS</p>
<p>Unofficial Fan Site</p>
</footer>

<script>

}

];

function displayWorks(category="ALL") {
  const container = document.getElementById("discography");

  const filtered = works
    .filter(work => category === "ALL" || work.category === category)
    .sort((a,b) => b.date.localeCompare(a.date));

  container.innerHTML = filtered.map(work => `
    <div class="item">
      <img src="${work.cover}"
           alt="${work.title}"
           onerror="this.style.opacity='.25'">
      <h3>${work.title}</h3>
      <p>${work.date}</p>
      <span class="category">${work.category}</span>
    </div>
  `).join("");
}

function filterItems(category,button) {
  document.querySelectorAll(".filters button")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");
  displayWorks(category);
}

displayWorks();

// コピー・右クリック等の制限
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("copy",e=>e.preventDefault());
document.addEventListener("cut",e=>e.preventDefault());

document.addEventListener("keydown",e=>{
  if((e.ctrlKey || e.metaKey) &&
    ["c","u","s","a"].includes(e.key.toLowerCase())) {
    e.preventDefault();
  }
});
</script>

</body>
</html>
